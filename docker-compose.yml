# Self-hosted deployment on your own always-on server (Hostinger VPS, or any
# Linux box with root).
#
#   mkdir -p sessions data reports
#   docker compose up -d --build
#
# One container runs the web app, the background job workers AND Chromium.
# No separate worker, no broker, no external browser service.

services:
  web:
    build: .
    image: report-automation:latest
    restart: unless-stopped          # survives a crash and a reboot
    env_file: .env
    ports:
      # Bound to localhost — Caddy terminates HTTPS and proxies to it.
      # While testing without a domain, change this to "8000:8000".
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind mounts, not named volumes, so you can scp the X login straight in
      # and read generated reports off the disk.
      - ./sessions:/app/sessions     # x_state.json — the X login
      - ./data:/app/data             # job working dirs, outputs, jobs.db
      - ./reports:/app/reports       # output if you run the CLI inside here
    # Chromium needs more than Docker's default 64 MB of shared memory, or tabs
    # crash on media-heavy posts.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # WA Toolkit — https://report.vedictech.in/wa
  #
  # Deliberately its own service: its own image, its own Chromium, its own
  # volume. It shares exactly one thing with the report tool — SESSION_SECRET
  # out of .env — and that is only so it can READ the ra_session login cookie
  # instead of having a login of its own. Building, restarting or removing this
  # service does not touch `web` above.
  #
  #   docker compose up -d --build wa
  # ---------------------------------------------------------------------------
  wa:
    build: ./wa
    image: wa-toolkit:latest
    restart: unless-stopped
    env_file: .env                   # SESSION_SECRET / SESSION_HOURS / COOKIE_SECURE
    environment:
      PORT: "8010"
      WA_DATA_DIR: /data
      WA_ROOT_PATH: /wa
      WA_FORCE_HEADLESS: "1"         # a VPS has no display; Chromium must be headless
    ports:
      # localhost only — Caddy reaches it as `wa:8010` over the compose network.
      # Published so `curl localhost:8010/health` works when debugging.
      - "127.0.0.1:8010:8010"
    volumes:
      # The WhatsApp login (wa_profile/), config.json, tasks.json, links.csv.
      # A bind mount so the login survives `--build` and you can back it up.
      - ./wa/data:/data
    # Chromium crashes on media-heavy chats with Docker's default 64 MB.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Report bot — Telegram front door for Report Maker.
  #
  # Talks to the app over HTTPS through Caddy rather than to `web:8000`
  # directly: with COOKIE_SECURE=1 the session cookie is marked Secure, and an
  # HTTP client (unlike a browser on localhost) will not send it back over
  # plain http — every CSRF check would fail as "this form expired".
  # So tg/.env must carry APP_URL=https://report.vedictech.in
  #
  #   docker compose up -d --build tg
  #   docker compose logs -f tg
  # ---------------------------------------------------------------------------
  tg:
    build: ./tg
    image: report-tgbot:latest
    restart: unless-stopped
    env_file: tg/.env              # TG_BOT_TOKEN, APP_URL, APP_USER, APP_PASSWORD
    environment:
      TG_DATA_DIR: /data
    volumes:
      # Each person's last project/style choice. A bind mount so a rebuild
      # doesn't make everyone pick again.
      - ./tg/data:/data
    depends_on:
      - web

  # ---------------------------------------------------------------------------
  # Bot 2 — the message splitter. Same image as `tg`, different entry point and
  # a different BotFather token: one bot, one job, one DM window.
  #
  # It needs no capture and no Chromium; it does not even need `web` unless a
  # RM_TOKEN is set, in which case it asks /v1 whether the person driving it may
  # send into other people's chats.
  # ---------------------------------------------------------------------------
  tg-splitter:
    # Behind a profile, like caddy above, for one reason: `env_file` is read
    # from the SERVER's disk at container start, and a missing file fails the
    # whole `docker compose up`, not just this service. A profile means a
    # server that has not been given tg/.env.splitter yet simply does not start
    # this bot, instead of refusing to start the web app. deploy.sh turns the
    # profile on by itself once the file is there.
    profiles: ["splitter"]
    build: ./tg
    image: report-tgbot:latest
    restart: unless-stopped
    command: ["python", "splitter.py"]
    env_file: tg/.env.splitter    # TG_SPLITTER_TOKEN, APP_URL, RM_TOKEN
    environment:
      TG_DATA_DIR: /data
    volumes:
      # The chat and people registries, and each person's remembered
      # destination. A bind mount so a rebuild does not make the bot forget
      # every group it has ever been in — Telegram gives it no way to look them
      # up again.
      - ./tg/data-splitter:/data
    depends_on:
      - web

  # ---------------------------------------------------------------------------
  # OPTIONAL: Caddy for automatic HTTPS, for a server with nothing else on
  # ports 80/443.
  #
  #   docker compose --profile caddy up -d
  #
  # If the server ALREADY runs nginx or Apache for another site, do NOT enable
  # this — two things cannot bind port 80. Point the existing web server at
  # 127.0.0.1:8000 instead (see README, "Behind an existing nginx").
  # ---------------------------------------------------------------------------
  caddy:
    profiles: ["caddy"]        # excluded from a plain `docker compose up -d`
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - wa

volumes:
  caddydata:
  caddyconfig:
