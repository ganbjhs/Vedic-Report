# WA Toolkit at /wa  —  paste this INSIDE the existing
#     server { server_name report.vedictech.in; ... }
# block, ABOVE the catch-all "location / { ... }".
#
# nginx picks the LONGEST matching prefix location, so "/wa/" wins over "/"
# and every other URL keeps going to the report tool exactly as before.
#
# The trailing slash on proxy_pass is load-bearing: it strips the /wa prefix,
# so the container sees "/" — the same thing Caddy's handle_path would do.
# Without it the app would receive "/wa/api/status" and 404 on everything.

location = /wa { return 308 /wa/; }

location /wa/ {
    proxy_pass http://127.0.0.1:8010/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A collect run over a big group holds the request open for minutes.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Matches MAX_UPLOAD_MB on the report side; server.py caps uploads at 5 MB.
    client_max_body_size 10M;
}
