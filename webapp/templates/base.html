<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Report Automation{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">
    {% include "_brand.svg" %}
    <span>Report Automation</span>
  </a>
  <nav class="topbar-nav">
    <a href="/" class="navlink{{ ' on' if nav == 'new' else '' }}">New report</a>
    <a href="/report-types" class="navlink{{ ' on' if nav == 'types' else '' }}">Report types</a>
    <a href="/admin/session-status" class="navlink{{ ' on' if nav == 'x' else '' }}">X login</a>
  </nav>
  <nav class="topbar-actions">
    <span class="who">{{ user }}</span>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <button class="ghost" type="submit">Sign out</button>
    </form>
  </nav>
</header>
{% endif %}

<main class="{% block main_class %}wrap{% endblock %}">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
