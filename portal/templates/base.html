<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Client Portal{% endblock %}</title>
  <link rel="stylesheet" href="/static/portal.css?v={{ asset_v }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%237a1f4b%27/%3E%3Cpath d=%27M7 22l6-8 5 5 7-9%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  {% block head %}{% endblock %}
</head>
<body{% if client and client.accent_hex %} style="--accent:{{ client.accent_hex }}"{% endif %}>
{% block body %}{% endblock %}
<script src="/static/portal.js?v={{ asset_v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
